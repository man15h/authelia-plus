---
# Builds the image the way upstream's release does: a binary per
# architecture, then the official Dockerfile copies it onto authelia/base,
# pinned by digest to the base tag of the upstream release this branch is on.
# dev pushes `alpha`; main pushes `latest`, `stable` and the next
# `v<upstream>-plus.<n>` version, then tags and releases it with a changelog
# of the commits since the previous release. Merge dev into main with a merge
# commit: a squash leaves one commit for the changelog to list.
name: Build & Push Docker Image

on:
  push:
    branches: [dev, main]

permissions:
  contents: read

# One run per branch at a time, so two quick merges to main don't both work
# out the same -plus version. A queued run waits rather than cancelling the
# one that is publishing.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      upstream: ${{ steps.v.outputs.upstream }}
      base-sha: ${{ steps.v.outputs.base-sha }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # tags are the version source
          persist-credentials: false

      # The upstream release is the nearest tag without a suffix, so our own
      # -plus tags are skipped. On main the next version is that release with
      # the next free -plus number; dev builds are not versioned.
      - name: Versions
        id: v
        # yamllint disable rule:indentation
        run: |
          UPSTREAM=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' | sed 's/^v//')
          BASE=$(docker buildx imagetools inspect "docker.io/authelia/base:${UPSTREAM}" --format '{{.Manifest.Digest}}')
          echo "upstream=${UPSTREAM}" >> "$GITHUB_OUTPUT"
          echo "base-sha=${BASE#sha256:}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            N=$(git tag -l "v${UPSTREAM}-plus.*" | sed 's/.*-plus\.//' | sort -n | tail -n 1)
            echo "version=${UPSTREAM}-plus.$((${N:-0} + 1))" >> "$GITHUB_OUTPUT"
          fi
        # yamllint enable rule:indentation

  # Native runners per architecture, as CGO needs a C toolchain for the
  # target. Same build as test.yml's unit-test job.
  binary:
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the build reads its version from git describe
          persist-credentials: false

      # Local only, so the binary reports the release version. The release
      # job pushes the tag once the image is up.
      - name: Tag the release locally
        if: needs.version.outputs.version != ''
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: git tag "v${VERSION}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 12.4.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24

      - name: Build
        run: go run ./cmd/authelia-scripts --log-level debug build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: authelia-linux-${{ matrix.arch }}
          path: dist/authelia
          if-no-files-found: error
          retention-days: 1

  image:
    needs: [version, binary]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Lands as authelia-linux-<arch>/authelia, where the Dockerfile expects
      # it. Artifacts drop the mode bits.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: authelia-linux-*

      - run: chmod 0755 authelia-linux-*/authelia

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=alpha,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.version != '' }}
            type=sha

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            TAG=${{ needs.version.outputs.upstream }}
            SHA=${{ needs.version.outputs.base-sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Tag and GitHub release for a main build: a changelog from the commits
  # since the last release, then the image by tag and by digest.
  release:
    if: github.ref == 'refs/heads/main'
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the changelog range starts at a tag
          persist-credentials: false

      # Non-merge commit subjects since the previous -plus release, or since
      # the upstream release for the first one on it, grouped by conventional
      # type. Subjects only ever pass through git log and awk, never the shell.
      # An explicit bash shell adds pipefail, so a failing git log fails the
      # release instead of shipping it without a changelog.
      - name: Changelog
        shell: bash
        env:
          UPSTREAM: ${{ needs.version.outputs.upstream }}
        # yamllint disable rule:indentation
        run: |
          N=$(git tag -l "v${UPSTREAM}-plus.*" | sed 's/.*-plus\.//' | sort -n | tail -n 1)
          FROM="v${UPSTREAM}${N:+-plus.${N}}"
          git log --reverse --no-merges --abbrev=7 --format='%h%x09%s' "${FROM}..${GITHUB_SHA}" |
            awk -F '\t' '
              BEGIN { n = split("Features|Fixes|CI/Build|Docs|Other", groups, "|") }
              {
                group = "Other"
                line = $2
                if (match($2, /^[a-z]+(\([^)]*\))?!?: /)) {
                  head = substr($2, 1, RLENGTH - 2)
                  line = substr($2, RLENGTH + 1)
                  type = head
                  sub(/[(!].*/, "", type)
                  if (type == "feat") group = "Features"
                  else if (type == "fix") group = "Fixes"
                  else if (type == "ci" || type == "build") group = "CI/Build"
                  else if (type == "docs") group = "Docs"
                  if (head ~ /\(/) {
                    scope = head
                    sub(/^[^(]*\(/, "", scope)
                    sub(/\)!?$/, "", scope)
                    line = "**" scope ":** " line
                  }
                  if (head ~ /!$/) line = line " **(breaking)**"
                }
                items[group] = items[group] "- " line " (`" $1 "`)\n"
              }
              END {
                for (i = 1; i <= n; i++) {
                  if (groups[i] in items) printf "### %s\n\n%s\n", groups[i], items[groups[i]]
                }
              }
            ' > changes.md
        # yamllint enable rule:indentation

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          V: ${{ needs.version.outputs.version }}
          UPSTREAM: ${{ needs.version.outputs.upstream }}
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          # Lowercased, as metadata-action pushed it.
          IMG=${IMG,,}
          TITLE="authelia-plus ${V}, on upstream Authelia v${UPSTREAM}, built from ${GITHUB_SHA::7}."
          printf '%s\n\n' "$TITLE" > notes.md
          cat changes.md >> notes.md
          cat >> notes.md <<EOF
          ### Docker image

          \`\`\`
          docker pull ${IMG}:${V}
          \`\`\`

          Pinned: \`${IMG}@${DIGEST}\` (linux/amd64, linux/arm64)
          EOF
          gh release create "v${V}" --target "$GITHUB_SHA" --title "authelia-plus ${V}" --notes-file notes.md
...
